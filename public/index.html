<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Supermercado Acessível</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

    <main class="container">

        <header>
            <h1>Supermercado Acessível</h1>

            <p>
                Sistema de orientação por voz para pessoas
                com deficiência visual.
            </p>
        </header>

        <section class="principal">

            <h2>Como podemos ajudar?</h2>

            <p id="status">
                Pressione o botão para começar.
            </p>

            <button
                id="btnComecar"
                class="botao-principal"
            >
                🎤 Começar
            </button>

        </section>

        <section class="comandos">

            <h2>Comandos disponíveis</h2>

            <button class="botao-comando">
                 Onde estou?
            </button>

            <button class="botao-comando">
                 Quero encontrar leite
            </button>

            <button class="botao-comando">
                 Onde fica a padaria?
            </button>

            <button class="botao-comando">
                 O que tem à minha frente?
            </button>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
